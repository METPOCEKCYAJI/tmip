name: Build IPLocationRU x64 DLL

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest PluginInterface.h
        shell: pwsh
        run: |
          try {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/zhongyang219/TrafficMonitor/master/TrafficMonitor/PluginInterface.h" -OutFile "PluginInterface.h"
          } catch {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/zhongyang219/TrafficMonitorPlugins/main/include/PluginInterface.h" -OutFile "PluginInterface.h"
          }

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile DLL
        run: |
          cl.exe /std:c++17 /EHsc /LD /O2 /MT /DUNICODE /D_UNICODE IPLocationRU.cpp /Fe:IPLocationRU_x64.dll winhttp.lib gdiplus.lib ole32.lib user32.lib gdi32.lib

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPLocationRU_x64
          path: IPLocationRU_x64.dll
